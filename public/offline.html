<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · MoneyMaster</title>
<style>
  :root { color-scheme: light dark; --page:#f6f6f3; --ink:#1c1c1a; --muted:#6b6b66; --accent:#1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --page:#0d0d0d; --ink:#ededea; --muted:#a3a39e; --accent:#4d8fea; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--page); color:var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; box-sizing:border-box; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { font-size:20px; margin:20px 0 6px; }
  p { color:var(--muted); margin:0 0 24px; max-width:22rem; }
  button { font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; padding:10px 20px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>MoneyMaster needs a connection to load your transactions. Check your internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
